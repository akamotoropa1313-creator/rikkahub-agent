name: Build signed alpha candidate

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full SHA of the candidate (dispatch on this exact ref)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signed-alpha-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
      LAST_RELEASE_VERSION_CODE: ${{ vars.LAST_RELEASE_VERSION_CODE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
          submodules: recursive
      - name: Verify source and release version
        run: python3 .github/scripts/release_tools.py source
      - name: Check signing prerequisites without exposing values
        env:
          KEYSTORE: ${{ secrets.RIKKA_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RIKKA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RIKKA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RIKKA_RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          required = ['KEYSTORE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD', 'RELEASE_CERT_SHA256']
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('SIGNING BLOCKER: permanent signing identity is not configured')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - name: Install Android dependencies
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and verify Room schema
        run: |
          ./gradlew :app:compileDebugKotlin
          python3 .github/scripts/release_tools.py source
      - name: Full JVM regression gate
        run: ./gradlew testDebugUnitTest --continue
      - name: Android lint gate
        run: ./gradlew lintDebug --continue
      - name: Materialize existing signing identity temporarily
        env:
          KEYSTORE: ${{ secrets.RIKKA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'rikka-release.keystore'
          with path.open('xb') as out:
              os.chmod(path, 0o600)
              out.write(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RIKKA_RELEASE_STORE_FILE=' + str(path) + '\n')
          PY
      - name: Build and lint signed release variant
        env:
          RIKKA_RELEASE_STORE_PASSWORD: ${{ secrets.RIKKA_RELEASE_STORE_PASSWORD }}
          RIKKA_RELEASE_KEY_ALIAS: ${{ secrets.RIKKA_RELEASE_KEY_ALIAS }}
          RIKKA_RELEASE_KEY_PASSWORD: ${{ secrets.RIKKA_RELEASE_KEY_PASSWORD }}
        # Signing passwords must not be serialized into the Gradle configuration cache.
        run: ./gradlew --no-configuration-cache :app:assembleRelease :app:lintRelease
      - name: Verify APK identity, signatures, ABI and checksums
        run: python3 .github/scripts/release_tools.py apk app/build/outputs/apk/release release-output
      - uses: actions/upload-artifact@v4
        with:
          name: signed-alpha-${{ inputs.expected_commit }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing identity
        if: always()
        run: rm -f -- "$RUNNER_TEMP/rikka-release.keystore"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-alpha-test-reports-${{ inputs.expected_commit }}
          path: |
            **/build/test-results/testDebugUnitTest/*.xml
            **/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 30
