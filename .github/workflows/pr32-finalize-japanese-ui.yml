name: Finalize Codex Japanese UI

on:
  push:
    branches:
      - codex/japanese-ui-localization
    paths:
      - .github/workflows/pr32-finalize-japanese-ui.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/japanese-ui-localization
          submodules: recursive

      - name: Apply final localization coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/pr32_finalize_japanese_ui.py')
          text = p.read_text()
          text = text.replace('既定タ���イアを明示的に要求します。', '既定のサービスタイアを明示的に要求します。')
          p.write_text(text)
          PY
          python3 .github/scripts/pr32_finalize_japanese_ui.py
          git diff --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - name: Install Android build dependencies
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4

      - name: Compile app
        run: ./gradlew :app:compileDebugKotlin

      - name: Run Codex UI tests
        run: ./gradlew :app:testDebugUnitTest --tests 'me.rerere.rikkahub.ui.components.codex.*Test'

      - name: Commit final localization coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/me/rerere/rikkahub/ui/components/codex/CodexControlSheet.kt
          git commit -m "ui(codex): complete Japanese control center coverage"
          git push origin HEAD:codex/japanese-ui-localization
