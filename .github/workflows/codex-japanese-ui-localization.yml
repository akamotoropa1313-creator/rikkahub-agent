name: Apply Codex Japanese UI localization

on:
  push:
    branches:
      - codex/japanese-ui-localization
    paths:
      - .github/workflows/codex-japanese-ui-localization.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out localization branch
        uses: actions/checkout@v4
        with:
          ref: codex/japanese-ui-localization
          submodules: recursive

      - name: Apply localization wiring
        run: |
          python3 .github/scripts/wire_codex_localization.py
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Compile app
        run: ./gradlew :app:compileDebugKotlin

      - name: Run Codex UI tests
        run: ./gradlew :app:testDebugUnitTest --tests 'me.rerere.rikkahub.ui.components.codex.*Test'

      - name: Commit localized UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/me/rerere/rikkahub/ui/components/ai/FilesPicker.kt \
            app/src/main/java/me/rerere/rikkahub/ui/components/codex/CodexAccountCard.kt \
            app/src/main/java/me/rerere/rikkahub/ui/components/codex/CodexApprovalCards.kt \
            app/src/main/java/me/rerere/rikkahub/ui/components/codex/CodexExecutionCards.kt \
            app/src/main/java/me/rerere/rikkahub/ui/components/codex/CodexControlSheet.kt
          git commit -m "ui(codex): localize controls for Japanese"
          git push origin HEAD:codex/japanese-ui-localization
