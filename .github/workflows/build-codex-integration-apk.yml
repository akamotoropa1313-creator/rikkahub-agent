name: Build diagnostic debug APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Verify web toolchain
        run: |
          bun --version
          pnpm --version

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble diagnostic debug APKs
        run: ./gradlew :app:assembleDebug

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk/debug -name '*.apk' -type f -print0 | xargs -0 ls -lh
          test -n "$(find app/build/outputs/apk/debug -name '*arm64-v8a*.apk' -type f -print -quit)"
          test -n "$(find app/build/outputs/apk/debug -name '*x86_64*.apk' -type f -print -quit)"
          test -n "$(find app/build/outputs/apk/debug -name '*universal*.apk' -type f -print -quit)"

      - name: Upload diagnostic debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-diagnostic-debug-apks-not-for-performance-testing
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
