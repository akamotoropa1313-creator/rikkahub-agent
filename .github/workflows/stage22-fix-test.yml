name: Stage22 one-shot test fix

on:
  push:
    branches:
      - codex/-stage22

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/-stage22
          fetch-depth: 0
      - name: Apply deterministic test-only fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/test/java/me/rerere/rikkahub/data/codex/appserver/CodexAppServerTurnApiTest.kt')
          text = path.read_text()
          old = '''    fun `stage 22 review mode items are typed preserve raw and reject malformed known fields`() {\n'''
          new = '''    fun `stage 22 review mode items are typed preserve raw and reject malformed known fields`() = runBlocking {\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/stage22-fix-test.yml
          git diff --check
          git diff -- app/src/test/java/me/rerere/rikkahub/data/codex/appserver/CodexAppServerTurnApiTest.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/test/java/me/rerere/rikkahub/data/codex/appserver/CodexAppServerTurnApiTest.kt .github/workflows/stage22-fix-test.yml
          git commit -m 'test(codex): run review decode assertion in coroutine'
          git push origin HEAD:codex/-stage22
