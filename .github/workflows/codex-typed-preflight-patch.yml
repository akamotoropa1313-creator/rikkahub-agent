name: Apply Codex typed preflight patch

# One-shot guarded applier. The successful job removes this workflow in its own commit.
on:
  pull_request:
    paths:
      - .github/workflows/codex-typed-preflight-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unified-harness-model-picker
          fetch-depth: 0

      - name: Apply guarded ChatService patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/me/rerere/rikkahub/service/ChatService.kt')
          text = path.read_text()

          total_legacy_calls = text.count('codexInputCapability(')
          if total_legacy_calls != 2:
              raise SystemExit(f'expected exactly two legacy capability calls total, found {total_legacy_calls}')

          old_import = "import me.rerere.rikkahub.data.codex.appserver.CodexInputCapability\nimport me.rerere.rikkahub.data.codex.appserver.codexInputCapability\n"
          new_import = "import me.rerere.rikkahub.data.codex.appserver.CodexInputCapability\nimport me.rerere.rikkahub.data.codex.appserver.CodexHarnessModelRouteResolver\nimport me.rerere.rikkahub.data.codex.appserver.codexHarnessInputCapability\n"
          import_count = text.count(old_import)
          if import_count != 1:
              raise SystemExit(f'expected one Codex input-capability import block, found {import_count}')
          text = text.replace(old_import, new_import, 1)

          catalog = "        val loadedCatalog = runtime.capabilities.value.models.takeIf { it.isNotEmpty() }\n"
          route = "        val harnessRoute = CodexHarnessModelRouteResolver.resolve(assistant, settingsStore.settingsFlow.value)\n"
          catalog_count = text.count(catalog)
          if catalog_count != 1:
              raise SystemExit(f'expected exactly one loadedCatalog site, found {catalog_count}')
          text = text.replace(catalog, catalog + route, 1)

          old_image = 'codexInputCapability(assistant.codexModel, loadedCatalog, "image")'
          new_image = 'codexHarnessInputCapability(harnessRoute, loadedCatalog, "image")'
          image_count = text.count(old_image)
          if image_count != 1:
              raise SystemExit(f'expected exactly one legacy image capability call, found {image_count}')
          text = text.replace(old_image, new_image, 1)

          old_audio = 'codexInputCapability(assistant.codexModel, loadedCatalog, "audio")'
          new_audio = 'codexHarnessInputCapability(harnessRoute, loadedCatalog, "audio")'
          audio_count = text.count(old_audio)
          if audio_count != 1:
              raise SystemExit(f'expected exactly one legacy audio capability call, found {audio_count}')
          text = text.replace(old_audio, new_audio, 1)

          if 'codexInputCapability(' in text:
              raise SystemExit('legacy capability call remained after guarded replacement')
          path.write_text(text)
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/codex-typed-preflight-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/me/rerere/rikkahub/service/ChatService.kt .github/workflows/codex-typed-preflight-patch.yml
          git diff --cached --check
          git commit -m "fix(codex): apply typed model preflight in chat service"
          git push origin HEAD:codex/unified-harness-model-picker
