name: Apply PR 31 review fixes

on:
  push:
    branches:
      - codex-app-server-integration
    paths:
      - .github/workflows/pr31-review-fix-applier.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: codex-app-server-integration
          submodules: recursive

      - name: Write patch script
        shell: bash
        run: |
          printf '%s' '  JfMDAwKQogICAgICAgIGFzc2VydEZhbHNlKGNsb3NlVGhyZWFkLmlzQWxpdmUpCiAgICAgICAgYXNzZXJ0RmFsc2UobW9uaXRvclRocmVhZC5pc0FsaXZlKQogICAgfQoKJycnCnJlcGxhY2Vfb25jZShwcm9jZXNzX3Rlc3QsIHdvcmtzcGFjZV9tYXJrZXIsIHdvcmtzcGFjZV90ZXN0ICsgd29ya3NwYWNlX21hcmtlcikK' | base64 -d > /tmp/pr31_fix.py
          python3 -m py_compile /tmp/pr31_fix.py

      - name: Apply focused review fixes and regression tests
        shell: bash
        run: |
          python3 /tmp/pr31_fix.py
          git diff --check
          git diff -- app/src/main/java/me/rerere/rikkahub/service/CodexChatRuntime.kt \
            app/src/test/java/me/rerere/rikkahub/service/CodexChatRuntimeIntegrationTest.kt \
            workspace/src/main/java/me/rerere/workspace/WorkspaceInteractiveProcess.kt \
            workspace/src/test/java/me/rerere/workspace/WorkspaceInteractiveProcessTest.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run focused regression tests
        run: >-
          ./gradlew
          :app:testDebugUnitTest --tests 'me.rerere.rikkahub.service.CodexChatRuntimeIntegrationTest'
          :workspace:testDebugUnitTest --tests 'me.rerere.workspace.WorkspaceInteractiveProcessTest'

      - name: Commit reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/me/rerere/rikkahub/service/CodexChatRuntime.kt \
            app/src/test/java/me/rerere/rikkahub/service/CodexChatRuntimeIntegrationTest.kt \
            workspace/src/main/java/me/rerere/workspace/WorkspaceInteractiveProcess.kt \
            workspace/src/test/java/me/rerere/workspace/WorkspaceInteractiveProcessTest.kt
          git commit -m "fix(codex): address final integration review"
          git push origin HEAD:codex-app-server-integration
