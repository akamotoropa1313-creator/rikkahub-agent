name: Stage22 scoped fix

on:
  push:
    branches:
      - codex/-stage22

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.event.head_commit.message != 'fix(codex): complete native review lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/-stage22
          fetch-depth: 0
      - name: Apply deterministic Stage22 patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Fix the production compile error without changing event semantics.
          replace_once(
              'app/src/main/java/me/rerere/rikkahub/service/CodexChatRuntime.kt',
              '''                is CodexAppServerTurnEvent.ItemCompleted -> {\n                    when (val item = event.item) {\n                        is CodexAppServerItemSnapshot.CommandExecution -> commands[item.id] = item\n                        is CodexAppServerItemSnapshot.FileChange -> files[item.id] = item\n                        else -> Unit\n                    }\n                    if (item is CodexAppServerItemSnapshot.ExitedReviewMode && reviewResultsPersisted.add(event.turnId)) {''',
              '''                is CodexAppServerTurnEvent.ItemCompleted -> {\n                    val item = event.item\n                    when (item) {\n                        is CodexAppServerItemSnapshot.CommandExecution -> commands[item.id] = item\n                        is CodexAppServerItemSnapshot.FileChange -> files[item.id] = item\n                        else -> Unit\n                    }\n                    if (item is CodexAppServerItemSnapshot.ExitedReviewMode && reviewResultsPersisted.add(event.turnId)) {'''
          )

          # Stable v2 Commit ReviewTarget keeps title present and nullable.
          replace_once(
              'app/src/test/java/me/rerere/rikkahub/data/codex/appserver/CodexAppServerTurnApiTest.kt',
              '''                CodexAppServerReviewTarget.Commit("def") to buildJsonObject { put("type", "commit"); put("sha", "def") },''',
              '''                CodexAppServerReviewTarget.Commit("def") to buildJsonObject { put("type", "commit"); put("sha", "def"); put("title", JsonNull) },'''
          )

          # Service-owned review lifecycle. appScope owns the coroutine, not a ViewModel.
          replace_once(
              'app/src/main/java/me/rerere/rikkahub/service/ChatService.kt',
              '''    private val codexOpenMutexes = ConcurrentHashMap<Uuid, Mutex>()\n    private val sendAdmissionMutexes = ConcurrentHashMap<Uuid, Mutex>()\n    private val codexMessageIds = ConcurrentHashMap<String, Uuid>()''',
              '''    private val codexOpenMutexes = ConcurrentHashMap<Uuid, Mutex>()\n    private val sendAdmissionMutexes = ConcurrentHashMap<Uuid, Mutex>()\n    private val codexReviewJobs = ConcurrentHashMap<Uuid, Job>()\n    private val codexMessageIds = ConcurrentHashMap<String, Uuid>()'''
          )
          replace_once(
              'app/src/main/java/me/rerere/rikkahub/service/ChatService.kt',
              '''        codexOpenMutexes.clear()\n        sendAdmissionMutexes.clear()\n        codexMessageIds.clear()''',
              '''        codexReviewJobs.values.forEach(Job::cancel)\n        codexReviewJobs.clear()\n        codexOpenMutexes.clear()\n        sendAdmissionMutexes.clear()\n        codexMessageIds.clear()'''
          )
          replace_once(
              'app/src/main/java/me/rerere/rikkahub/service/ChatService.kt',
              '''    suspend fun startCodexReview(id: Uuid, target: CodexAppServerReviewTarget) = withCodexCapabilityLease(id) { runtime ->\n        val result = runtime.startReview(target)\n        try { runtime.awaitTurnTerminal(result.turn.id) } finally { runtime.finishTurn(result.turn.id) }\n    }\n    suspend fun setCodexSkillEnabled''',
              '''    suspend fun startCodexReview(id: Uuid, target: CodexAppServerReviewTarget) = withCodexCapabilityLease(id) { runtime ->\n        val result = runtime.startReview(target)\n        try { runtime.awaitTurnTerminal(result.turn.id) } finally { runtime.finishTurn(result.turn.id) }\n    }\n\n    /**\n     * Starts review work in the service-owned AppScope. A screen/ViewModel may disappear while\n     * this job continues; the conversation reference prevents idle eviction and the existing\n     * Codex operation lease remains held until the server reports a terminal turn.\n     */\n    fun launchCodexReview(id: Uuid, target: CodexAppServerReviewTarget) {\n        synchronized(codexReviewJobs) {\n            if (codexReviewJobs[id]?.isActive == true) {\n                addError(IllegalStateException("A Codex review is already running."), id, title = "Codex review")\n                return\n            }\n            lateinit var job: Job\n            job = appScope.launch(start = CoroutineStart.LAZY) {\n                addConversationReference(id)\n                try {\n                    startCodexReview(id, target)\n                } catch (cancelled: CancellationException) {\n                    throw cancelled\n                } catch (failure: Throwable) {\n                    addError(failure, id, title = "Codex review failed")\n                } finally {\n                    removeConversationReference(id)\n                    synchronized(codexReviewJobs) {\n                        if (codexReviewJobs[id] === job) codexReviewJobs.remove(id)\n                    }\n                }\n            }\n            codexReviewJobs[id] = job\n            job.start()\n        }\n    }\n\n    /** Stop is a server turn interrupt; do not cancel the owner job before terminal authority. */\n    fun stopCodexReview(id: Uuid) {\n        appScope.launch { stopGeneration(id) }\n    }\n\n    suspend fun setCodexSkillEnabled'''
          )

          # ViewModel only dispatches commands; it no longer owns the long-running review coroutine.
          replace_once(
              'app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatVM.kt',
              '''import me.rerere.rikkahub.service.CodexConversationUiState''',
              '''import me.rerere.rikkahub.service.CodexConversationUiState\nimport me.rerere.rikkahub.service.CodexReviewAction'''
          )
          replace_once(
              'app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatVM.kt',
              '''    fun startCodexReview(target: CodexAppServerReviewTarget) { viewModelScope.launch { runCatching { chatService.startCodexReview(_conversationId, target) } } }''',
              '''    fun startCodexReview(action: CodexReviewAction) {\n        when (action) {\n            is CodexReviewAction.Start -> chatService.launchCodexReview(_conversationId, action.target)\n            CodexReviewAction.Stop -> chatService.stopCodexReview(_conversationId)\n        }\n    }'''
          )

          # Review UI actions include an explicit Stop and start is gated on live connectivity.
          replace_once(
              'app/src/main/java/me/rerere/rikkahub/ui/components/codex/CodexControlSheet.kt',
              '''import me.rerere.rikkahub.service.CodexReviewUiState''',
              '''import me.rerere.rikkahub.service.CodexReviewUiState\nimport me.rerere.rikkahub.service.CodexReviewAction'''
          )
          replace_once(
              'app/src/main/java/me/rerere/rikkahub/ui/components/codex/CodexControlSheet.kt',
              '''    onStartReview: (CodexAppServerReviewTarget) -> Unit,''',
              '''    onStartReview: (CodexReviewAction) -> Unit,'''
          )
          replace_once(
              'app/src/main/java/me/rerere/rikkahub/ui/components/codex/CodexControlSheet.kt',
              '''                if (review.inProgress) Text("Review in progress · ${review.targetSummary.orEmpty()}")\n                review.error?.let { Text(it, color = MaterialTheme.colorScheme.error) }\n                val valid = when (reviewKind) { "Base branch" -> branch.isNotBlank(); "Commit" -> sha.isNotBlank(); "Custom" -> instructions.isNotBlank(); else -> true }\n                Button(modifier = Modifier.fillMaxWidth().heightIn(min = 44.dp), enabled = valid && !review.inProgress && !operationBusy, onClick = {\n                    onStartReview(when (reviewKind) {\n                        "Base branch" -> CodexAppServerReviewTarget.BaseBranch(branch)\n                        "Commit" -> CodexAppServerReviewTarget.Commit(sha, title.takeIf(String::isNotBlank))\n                        "Custom" -> CodexAppServerReviewTarget.Custom(instructions)\n                        else -> CodexAppServerReviewTarget.UncommittedChanges\n                    })\n                }) { Text("Start review") }''',
              '''                if (review.inProgress) {\n                    Text("Review in progress · ${review.targetSummary.orEmpty()}")\n                    Button(\n                        modifier = Modifier.fillMaxWidth().heightIn(min = 44.dp),\n                        enabled = capabilities.connected,\n                        onClick = { onStartReview(CodexReviewAction.Stop) },\n                    ) { Text("Stop review") }\n                }\n                review.error?.let { Text(it, color = MaterialTheme.colorScheme.error) }\n                val valid = when (reviewKind) { "Base branch" -> branch.isNotBlank(); "Commit" -> sha.isNotBlank(); "Custom" -> instructions.isNotBlank(); else -> true }\n                Button(modifier = Modifier.fillMaxWidth().heightIn(min = 44.dp), enabled = capabilities.connected && valid && !review.inProgress && !operationBusy, onClick = {\n                    onStartReview(CodexReviewAction.Start(when (reviewKind) {\n                        "Base branch" -> CodexAppServerReviewTarget.BaseBranch(branch)\n                        "Commit" -> CodexAppServerReviewTarget.Commit(sha, title.takeIf(String::isNotBlank))\n                        "Custom" -> CodexAppServerReviewTarget.Custom(instructions)\n                        else -> CodexAppServerReviewTarget.UncommittedChanges\n                    }))\n                }) { Text("Start review") }'''
          )

          # Keep UI control actions separate from the native protocol target domain.
          runtime = Path('app/src/main/java/me/rerere/rikkahub/service/CodexChatRuntime.kt')
          text = runtime.read_text()
          marker = '''data class CodexReviewUiState(\n    val starting: Boolean = false,\n    val activeTurnId: String? = null,\n    val targetSummary: String? = null,\n    val error: String? = null,\n) {\n    val inProgress: Boolean get() = starting || activeTurnId != null\n}\n'''
          if text.count(marker) != 1:
              raise SystemExit('CodexChatRuntime.kt: review state marker mismatch')
          replacement = marker + '''\nsealed interface CodexReviewAction {\n    data class Start(val target: CodexAppServerReviewTarget) : CodexReviewAction\n    data object Stop : CodexReviewAction\n}\n'''
          runtime.write_text(text.replace(marker, replacement, 1))

          # The workflow is deliberately self-removing; it is only a connector-safe patch carrier.
          Path('.github/workflows/stage22-fix.yml').unlink()
          PY

          git diff --check
          git status --short
      - name: Commit scoped fixes
        shell: bash
        run: |
          git config user.name 'ChatGPT Stage22 Fix'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(codex): complete native review lifecycle'
          git push origin HEAD:codex/-stage22
