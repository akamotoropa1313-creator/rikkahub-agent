name: Codex App Server protocol tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-staged-pr33:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/runtime-provisioning-first-run'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Materialize already-verified staged patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/pr33_first_run_apply_v2.py
          git diff --check

      - name: Restore normal CI and remove temporary PR33 helpers
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --depth=1
          git checkout origin/master -- .github/workflows/codex-app-server-protocol-tests.yml
          git rm \
            .github/scripts/pr33_first_run_apply.py \
            .github/scripts/pr33_first_run_apply_v2.py \
            .github/scripts/pr33_fix_apply_script.py \
            .github/workflows/pr33-first-run-apply.yml
          git diff --check

      - name: Commit materialized first-run implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat(codex): materialize verified first-run flow"
          git push origin HEAD:${{ github.head_ref }}
