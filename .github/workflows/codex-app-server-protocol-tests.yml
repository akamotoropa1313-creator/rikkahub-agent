name: Codex App Server protocol tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/runtime-provisioning-first-run
          submodules: recursive
          fetch-depth: 0

      - name: Materialize requested Codex UX fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/pr33_localize_and_provision_on_enable.py
          git diff --check
          git fetch origin master
          git checkout origin/master -- .github/workflows/codex-app-server-protocol-tests.yml
          git rm .github/scripts/pr33_localize_and_provision_on_enable.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(codex): localize UI and provision runtime on enable"
          git push origin HEAD:codex/runtime-provisioning-first-run
