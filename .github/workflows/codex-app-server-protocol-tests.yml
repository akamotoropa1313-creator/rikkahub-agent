name: Codex App Server protocol tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Verify web toolchain
        run: |
          bun --version
          pnpm --version

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          available_packages="$(sdkmanager --list --channel=3)"
          if ! printf '%s\n' "$available_packages" | awk -F '|' '
            {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)
              if ($1 == "platforms;android-37.0") found = 1
            }
            END { exit(found ? 0 : 1) }
          '; then
            echo "Required SDK package platforms;android-37.0 is unavailable." >&2
            printf '%s\n' "$available_packages" | grep -E 'platforms;android-37([.]|[[:space:]]|$)' || true
            exit 1
          fi
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Compile app and generate Room schemas
        run: ./gradlew :app:compileDebugKotlin

      - name: Upload generated Room v31 schema
        uses: actions/upload-artifact@v4
        with:
          name: codex-stage10-room-schema-v31
          path: app/schemas/me.rerere.rikkahub.data.db.AppDatabase/31.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated Room v31 schema to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          schema='app/schemas/me.rerere.rikkahub.data.db.AppDatabase/31.json'
          test -f "$schema"
          actual_sha256="$(sha256sum "$schema" | awk '{print $1}')"
          if [[ "$actual_sha256" != '05267c5e9faadb9c66423f11b125b6a5797445eed326480d21305279a927a873' ]]; then
            echo "Generated Room schema hash changed unexpectedly: $actual_sha256" >&2
            exit 1
          fi
          content="$(base64 -w 0 "$schema")"
          jq -n \
            --arg message 'chore(db): commit Room schema v31' \
            --arg content "$content" \
            --arg branch "$PR_HEAD_REF" \
            '{message:$message, content:$content, branch:$branch}' \
            > /tmp/room-schema-create.json
          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/${schema}" \
            --input /tmp/room-schema-create.json

      - name: Verify committed Room schemas are clean
        shell: bash
        run: |
          set -euo pipefail
          schema_status="$(git status --porcelain -- app/schemas/me.rerere.rikkahub.data.db.AppDatabase)"
          if [[ -n "$schema_status" ]]; then
            printf '%s\n' "$schema_status" >&2
            echo "Room/KSP generated uncommitted schema changes." >&2
            exit 1
          fi

      - name: Run Codex App Server protocol unit tests
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests 'me.rerere.rikkahub.data.codex.appserver.*Test'
          --tests 'me.rerere.rikkahub.ui.components.codex.*Test'

      - name: Run workspace interactive process unit tests
        run: >-
          ./gradlew :workspace:testDebugUnitTest
          --tests 'me.rerere.workspace.*Interactive*Test'

      - name: Print Codex App Server JUnit failure details
        if: failure()
        shell: bash
        run: |
          find app/build/test-results/testDebugUnitTest \
            \( -name 'TEST-me.rerere.rikkahub.data.codex.appserver.*Test.xml' \
            -o -name 'TEST-me.rerere.rikkahub.ui.components.codex.*Test.xml' \) \
            -print -exec cat {} \; 2>/dev/null || true

      - name: Print workspace interactive process JUnit failure details
        if: failure()
        shell: bash
        run: |
          find workspace/build/test-results/testDebugUnitTest -name '*Interactive*Test.xml' -print -exec cat {} \; 2>/dev/null || true
