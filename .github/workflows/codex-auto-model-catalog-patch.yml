name: Apply Codex automatic model catalog refresh

on:
  pull_request:
    paths:
      - .github/workflows/codex-auto-model-catalog-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unified-harness-model-picker
          fetch-depth: 0

      - name: Apply guarded ChatVM patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatVM.kt')
          text = path.read_text()

          anchor_import = 'import me.rerere.rikkahub.data.codex.appserver.CodexRuntimeResolver\n'
          new_import = anchor_import + 'import me.rerere.rikkahub.data.codex.appserver.CodexModelCatalogKnowledge\n'
          if text.count(anchor_import) != 1:
              raise SystemExit(f'expected one CodexRuntimeResolver import, found {text.count(anchor_import)}')
          if 'CodexModelCatalogKnowledge' in text:
              raise SystemExit('CodexModelCatalogKnowledge already present')
          text = text.replace(anchor_import, new_import, 1)

          old = '''                chatService.prepareCodexSession(_conversationId)
'''
          new = '''                chatService.prepareCodexSession(_conversationId)
                if (CodexModelCatalogKnowledge.modelsSnapshot().isEmpty()) {
                    chatService.refreshCodexModels(_conversationId)
                }
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one prepareCodexSession call, found {text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/codex-auto-model-catalog-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatVM.kt .github/workflows/codex-auto-model-catalog-patch.yml
          git diff --cached --check
          git commit -m "ux(codex): refresh ChatGPT model catalog after connect"
          git push origin HEAD:codex/unified-harness-model-picker
