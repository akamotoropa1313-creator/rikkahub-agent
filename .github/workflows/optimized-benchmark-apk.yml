name: Build optimized benchmark APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "ai/**"
      - "common/**"
      - "document/**"
      - "highlight/**"
      - "llama-cpp/**"
      - "local-llm/**"
      - "material3/**"
      - "search/**"
      - "speech/**"
      - "web/**"
      - "workspace/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradle/libs.versions.toml"
      - ".github/scripts/add_optimized_benchmark_build.py"
      - ".github/workflows/optimized-benchmark-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Inject release-equivalent benchmark variant
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/add_optimized_benchmark_build.py
          sed -n '/buildTypes {/,/compileOptions {/p' app/build.gradle.kts

      - name: Build optimized benchmark APK
        run: ./gradlew :app:assembleBenchmark

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk/benchmark -name '*.apk' -type f -print0 | xargs -0 ls -lh
          test -n "$(find app/build/outputs/apk/benchmark -name '*arm64-v8a*.apk' -type f -print -quit)"

      - name: Upload optimized benchmark APKs
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-optimized-benchmark-apk
          path: app/build/outputs/apk/benchmark/*.apk
          if-no-files-found: error
          retention-days: 14
