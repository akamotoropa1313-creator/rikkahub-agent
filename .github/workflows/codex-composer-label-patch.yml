name: Apply Codex composer label patch

on:
  pull_request:
    paths:
      - .github/workflows/codex-composer-label-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unified-harness-model-picker
          fetch-depth: 0

      - name: Apply guarded ChatPage patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatPage.kt')
          text = path.read_text()
          old = 'text = codexComposerLabel(assistant, codexCapabilities.models),'
          new = 'text = codexComposerLabel(assistant, codexCapabilities.models, setting.providers),'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one composer label call, found {count}')
          text = text.replace(old, new, 1)
          if old in text:
              raise SystemExit('legacy composer label call remained after replacement')
          path.write_text(text)
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/codex-composer-label-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatPage.kt .github/workflows/codex-composer-label-patch.yml
          git diff --cached --check
          git commit -m "ui(codex): show external provider model in composer"
          git push origin HEAD:codex/unified-harness-model-picker
