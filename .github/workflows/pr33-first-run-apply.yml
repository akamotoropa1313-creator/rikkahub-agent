name: Finalize Codex first-run UX

on:
  push:
    branches:
      - codex/runtime-provisioning-first-run
    paths:
      - .github/workflows/pr33-first-run-apply.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/runtime-provisioning-first-run
          submodules: recursive

      - name: Materialize verified first-run patch
        run: |
          set -euo pipefail
          python3 .github/scripts/pr33_first_run_apply_v2.py
          git diff --check

      - name: Remove staged-patch CI hook and temporary helpers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/codex-app-server-protocol-tests.yml')
          text = workflow.read_text()
          block = '''      - name: Apply staged PR33 first-run patch
        run: |
          python3 .github/scripts/pr33_first_run_apply_v2.py
          git diff --check

'''
          if text.count(block) != 1:
              raise SystemExit(f'expected exactly one staged patch block, found {text.count(block)}')
          workflow.write_text(text.replace(block, '', 1))
          PY
          git rm \
            .github/scripts/pr33_first_run_apply.py \
            .github/scripts/pr33_first_run_apply_v2.py \
            .github/scripts/pr33_fix_apply_script.py \
            .github/workflows/pr33-first-run-apply.yml
          git diff --check

      - name: Commit materialized fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 1
          fi
          git status --short
          git commit -m "feat(codex): materialize verified first-run flow"
          git push origin HEAD:codex/runtime-provisioning-first-run
